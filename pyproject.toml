[project]
name = "congressional-trading-alpha"
version = "0.1.0"
description = "Research code for congressional-trading-alpha"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "yfinance>=0.2.36",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "jupyter>=1.0.0",
    "scikit-learn>=1.4.0",
    "pytest>=7.0"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
