name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Results reproduce from the committed snapshot
        run: python -m src.event_study analyze > /dev/null && git diff --exit-code results/metrics.json
      - name: README numbers match the results
        run: python scripts/render_readme.py --check
